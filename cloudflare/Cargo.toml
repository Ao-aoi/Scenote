[package]
name = "scenote-cloudflare"
version = "0.1.0"
edition = "2021"
description = "Scenote の Cloudflare 版（Workers + Durable Objects）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scenote-core = { path = "../core" }
worker = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
base64 = "0.22"
sha2 = "0.10"
url = "2"

[profile.release]
opt-level = "s"
lto = true

